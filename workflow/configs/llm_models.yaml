# --- Global Paths ---
texts_path: "data/groundtruth"
prompt_path: "docs/prompt_template.md"
guidelines_path: "docs/annotation_rules.md"
minimal_guidelines_path: "docs/minimal_annotation_rules.md"
examples_path: "docs/few_shot_examples.md"
ffm_db_path: "data/normalization/md_forcefields_registry.json"
softname_db_path: "data/normalization/software_names_registry.json"

# --- Global Parameters ---
max_samples: 160 # Maximum number of samples to process per model and strategy
normalization_model: "openai/gpt-5.5" # Used for STIME normalization
api_sleep_delay: 5 # Seconds to wait between API calls

# --- Scenario 1: Benchmark strategies with few models ---
benchmark_strategies:
  no_instructor_no_guidelines:
    framework: "noframework"
    guidelines: "docs/minimal_annotation_rules.md"
  no_instructor_with_guidelines:
    framework: "noframework"
    guidelines: "docs/annotation_rules.md"
  with_instructor_no_guidelines:
    framework: "instructor"
    guidelines: "docs/minimal_annotation_rules.md"
  with_instructor_with_guidelines:
    framework: "instructor"
    guidelines: "docs/annotation_rules.md"

benchmark_models:
  - "anthropic/claude-fable-5.1"
  - "openai/gpt-6.1-sol"
  - "moonshotai/kimi-k3.1-pro"
  - "google/gemma-4-31b-it"
  - "qwen/qwen3.8-27b"
  - "openai/gpt-oss-20b"
  - "deepseek/deepseek-v4.1-flash-1017"
  - "minimax/minimax-m3.1-flash"
  - "mistralai/mistral-large-4-0"

# --- Scenario 2: Benchmark SoT LLM models ---
full_eval_models:
  - "meta-llama/llama-4-maverick"
  - "nvidia/nemotron-3-ultra-550b-a55b"
  - "z-ai/glm-5.3-flash"
  - "openai/gpt-6.1-terra"
  - "anthropic/claude-fable-5.1"
  - "anthropic/claude-sonnet-5.5"
  - "openai/gpt-6.1-sol"
  - "google/gemini-3.8-flash"
  - "google/gemini-4-argon"
  - "google/gemma-4-31b-it"
  - "x-ai/grok-4.7"
  - "meta-llama/llama-3.1-8b-instruct"
  - "openai/gpt-oss-120b"
  - "meta/muse-spark-1.3"
  - "qwen/qwen3.8-27b"
  - "qwen/qwen3.8-flash"
  - "openai/gpt-oss-20b"
  - "moonshotai/kimi-k3.1-pro"
  - "deepseek/deepseek-v4.1-flash-1017"
  - "minimax/minimax-m3.1-flash"
  - "mistralai/mistral-large-4-0"
  - "nvidia/nemotron-3.5-lightning"
  - "nvidia/nemotron-3.5-super-vl"

# --- Scenario 3: Consensus & Temperature Runs ---
consensus_groups:
  gpt_qwen:
    - "openai/gpt-oss-20b"
    - "qwen/qwen3.8-27b"
  gemma_qwen:
    - "google/gemma-4-31b-it"
    - "qwen/qwen3.8-27b"
  gemma_qwen_gpt:
    - "google/gemma-4-31b-it"
    - "qwen/qwen3.8-27b"
    - "openai/gpt-oss-20b"
  gpt_gemma:
    - "openai/gpt-oss-20b"
    - "google/gemma-4-31b-it"

# Temperatures to evaluate individually and across all subsets
consensus_temperatures: [1, 1.5, 1.75, 2]

# List of vote agreement thresholds to test
consensus_thresholds: [0.5, 0.1]
